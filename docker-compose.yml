version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_ridhointerior
    ports:
      - "3306:3306"
    # --- TAMBAHKAN 2 BARIS INI ---
    volumes:
      - mysql_data:/var/lib/mysql
    # -----------------------------

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

# --- TAMBAHKAN 2 BARIS INI DI PALING BAWAH ---
volumes:
  mysql_data: # ---------------------------------------------
